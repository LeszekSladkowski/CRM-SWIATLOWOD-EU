<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
  <meta name="theme-color" content="#001006">
  <meta name="color-scheme" content="dark">
  <title>AKTUALIZACJA APLIKACJI — CRM ŚWIATŁOWÓD EU</title>
  <link rel="stylesheet" href="./settings-update.css?v=karta1-live-02">
</head>
<body>
  <main id="updateViewport" aria-label="Karta 1 Aktualizacja aplikacji">
    <section id="updateStage" data-master="709x1536">
      <img id="updateMaster" src="./01_GRAFIKI_KART_WEJSCIOWE/03_USTAWIENIA_KARTA_1_AKTUALIZACJA_MASTER_1TO1.png?v=karta1-live-02" alt="" draggable="false">

      <svg id="updateLive" viewBox="0 0 709 1536" preserveAspectRatio="xMidYMid meet" aria-label="Warstwa LIVE aktualizacji">
        <defs>
          <clipPath id="pSyncIcon"><rect x="448" y="60" width="78" height="82" rx="18"/></clipPath>
          <clipPath id="pLastSync"><rect x="516" y="103" width="156" height="24" rx="4"/></clipPath>
          <clipPath id="pVersion"><rect x="46" y="366" width="288" height="84" rx="6"/></clipPath>
          <clipPath id="pInstall"><rect x="378" y="369" width="225" height="48" rx="6"/></clipPath>
          <clipPath id="pAuto"><rect x="45" y="516" width="235" height="48" rx="6"/></clipPath>
          <clipPath id="pState"><rect x="380" y="516" width="225" height="48" rx="6"/></clipPath>
          <clipPath id="pProgress"><rect x="42" y="748" width="620" height="70" rx="10"/></clipPath>
          <clipPath id="pProcess"><rect x="116" y="879" width="520" height="72" rx="5"/></clipPath>
          <clipPath id="pStep"><rect x="119" y="981" width="530" height="63" rx="5"/></clipPath>
        </defs>

        <!-- chirurgiczne czyszczenie dynamicznych miejsc Z WARSTWY BASE, bez czarnych nakładek -->
        <g id="basePatches" aria-hidden="true">
          <image href="./02_TLO_MASTER/03_USTAWIENIA_KARTA_1_AKTUALIZACJA_TLO_MASTER.png?v=karta1-live-02" x="0" y="0" width="709" height="1536" preserveAspectRatio="none" clip-path="url(#pSyncIcon)"/>
          <image href="./02_TLO_MASTER/03_USTAWIENIA_KARTA_1_AKTUALIZACJA_TLO_MASTER.png?v=karta1-live-02" x="0" y="0" width="709" height="1536" preserveAspectRatio="none" clip-path="url(#pLastSync)"/>
          <image href="./02_TLO_MASTER/03_USTAWIENIA_KARTA_1_AKTUALIZACJA_TLO_MASTER.png?v=karta1-live-02" x="0" y="0" width="709" height="1536" preserveAspectRatio="none" clip-path="url(#pVersion)"/>
          <image href="./02_TLO_MASTER/03_USTAWIENIA_KARTA_1_AKTUALIZACJA_TLO_MASTER.png?v=karta1-live-02" x="0" y="0" width="709" height="1536" preserveAspectRatio="none" clip-path="url(#pInstall)"/>
          <image href="./02_TLO_MASTER/03_USTAWIENIA_KARTA_1_AKTUALIZACJA_TLO_MASTER.png?v=karta1-live-02" x="0" y="0" width="709" height="1536" preserveAspectRatio="none" clip-path="url(#pAuto)"/>
          <image href="./02_TLO_MASTER/03_USTAWIENIA_KARTA_1_AKTUALIZACJA_TLO_MASTER.png?v=karta1-live-02" x="0" y="0" width="709" height="1536" preserveAspectRatio="none" clip-path="url(#pState)"/>
          <image href="./02_TLO_MASTER/03_USTAWIENIA_KARTA_1_AKTUALIZACJA_TLO_MASTER.png?v=karta1-live-02" x="0" y="0" width="709" height="1536" preserveAspectRatio="none" clip-path="url(#pProgress)"/>
          <image href="./02_TLO_MASTER/03_USTAWIENIA_KARTA_1_AKTUALIZACJA_TLO_MASTER.png?v=karta1-live-02" x="0" y="0" width="709" height="1536" preserveAspectRatio="none" clip-path="url(#pProcess)"/>
          <image href="./02_TLO_MASTER/03_USTAWIENIA_KARTA_1_AKTUALIZACJA_TLO_MASTER.png?v=karta1-live-02" x="0" y="0" width="709" height="1536" preserveAspectRatio="none" clip-path="url(#pStep)"/>
        </g>

        <!-- LIVE: SYNCHRONIZUJ -->
        <text id="lastSyncText" class="small-live" x="522" y="120">Ostatnia: --.--.---- --:--</text>
        <g id="syncTopVisual">
          <circle class="sync-ring" cx="486" cy="99" r="30"/>
          <g class="sync-arrows" id="syncTopArrows">
            <path d="M468 95 A21 21 0 0 1 503 83"/>
            <path d="M501 77 L505 84 L497 86"/>
            <path d="M507 104 A21 21 0 0 1 472 116"/>
            <path d="M474 122 L470 115 L478 113"/>
          </g>
        </g>

        <!-- LIVE: wersja / tryb / status -->
        <text id="installedVersion" class="value-green gold" x="50" y="396">—</text>
        <text id="installedBuild" class="value-sub" x="50" y="425">—</text>
        <text id="installMode" class="value-green" x="385" y="397">PRZEGLĄDARKA</text>
        <text id="updateMode" class="value-green" x="50" y="548">AUTOMATYCZNE</text>
        <text id="systemState" class="value-green" x="385" y="548">SPRAWDZANIE...</text>

        <!-- LIVE: wskaźnik aktualizacji 0–100 -->
        <rect class="progress-track" x="47" y="758" width="493" height="34" rx="12"/>
        <rect id="progressFill" class="progress-fill" x="51" y="762" width="0" height="26" rx="9"/>
        <circle id="progressGlow" class="progress-glow" cx="51" cy="775" r="14"/>
        <text id="progressPct" class="progress-pct" x="560" y="791">0%</text>
        <line class="scale-line" x1="49" y1="812" x2="650" y2="812"/>
        <g id="scaleLabels" class="scale-labels">
          <text x="49" y="851">0%</text><text x="106" y="851">10%</text><text x="164" y="851">20%</text><text x="222" y="851">30%</text><text x="280" y="851">40%</text><text x="338" y="851">50%</text><text x="396" y="851">60%</text><text x="454" y="851">70%</text><text x="512" y="851">80%</text><text x="570" y="851">90%</text><text x="625" y="851">100%</text>
        </g>

        <!-- LIVE: proces -->
        <text id="processTitle" class="process-title" x="121" y="909">Gotowy do sprawdzenia aktualizacji</text>
        <text id="processDetail" class="process-detail" x="121" y="940">Wskaźnik postępu działa płynnie od 0 do 100%</text>
        <text id="stepName" class="step-name" x="125" y="1007">SYSTEM GOTOWY</text>
        <text id="stepDetail" class="step-detail" x="125" y="1032">Oczekiwanie na rozpoczęcie procesu</text>
        <text id="etaLabel" class="eta-label" x="536" y="1004">Szacowany czas:</text>
        <text id="etaValue" class="eta-value" x="535" y="1032">00:00:00</text>

        <!-- aktywne strefy -->
        <rect class="hitbox" data-action="sync" x="449" y="63" width="235" height="84" rx="20"/>
        <rect class="hitbox" data-action="check" x="28" y="1094" width="211" height="169" rx="16"/>
        <rect class="hitbox" data-action="version" x="250" y="1094" width="210" height="169" rx="16"/>
        <rect class="hitbox" data-action="cache" x="470" y="1094" width="211" height="169" rx="16"/>
        <rect class="hitbox" data-action="pulpit" x="74" y="1315" width="560" height="90" rx="20"/>
      </svg>

      <div id="translationLayer" aria-hidden="true"></div>
      <dialog id="versionDialog">
        <button id="closeVersion" type="button">×</button>
        <h2 id="versionDialogTitle">INFORMACJE O WERSJI</h2>
        <pre id="versionDialogBody">—</pre>
      </dialog>
    </section>
  </main>
  <script src="./settings-update.js?v=karta1-live-02" defer></script>
</body>
</html>
